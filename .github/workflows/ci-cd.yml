name: Auth Function CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore CatCar.AuthFunction.slnx
      - name: Build solution
        run: dotnet build CatCar.AuthFunction.slnx -c Release --no-restore
      - name: Run unit tests
        run: dotnet test CatCar.AuthFunction.slnx -c Release --no-build

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homologation' }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR Login
        run: az acr login --name ${{ vars.ACR_NAME }}
      - name: Build and Push Docker Image
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/catcar-auth-function"
          TAG="${{ github.sha }}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  deploy-homologation:
    needs: docker-build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: homologation
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME || 'catcar-auth-function-homolog' }} \
            --resource-group ${{ vars.RESOURCE_GROUP || vars.CATCAR_FOUNDATION_RESOURCE_GROUP || 'catcar-homolog' }} \
            --image "${{ vars.ACR_NAME }}.azurecr.io/catcar-auth-function:${{ github.sha }}"

  deploy-production:
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME || 'catcar-auth-function-prod' }} \
            --resource-group ${{ vars.RESOURCE_GROUP || vars.CATCAR_FOUNDATION_RESOURCE_GROUP || 'catcar-prod' }} \
            --image "${{ vars.ACR_NAME }}.azurecr.io/catcar-auth-function:${{ github.sha }}"
